<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- the BASE_URL placeholder below becomes /portfolio/ on GitHub Pages (Vite fills it in) -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- the site is already dark: tells browsers (forced dark mode) and Dark Reader not to recolor it -->
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <title>kinjal-3d</title>
    <!-- start downloading the character right away, in parallel with the JavaScript (not after it).
         as="fetch" + crossorigin matches how three.js requests them, so the browser reuses these downloads.
         fetchpriority low: the intro's own files (JavaScript, CSS, fonts) still go first -->
    <link rel="preload" href="%BASE_URL%models/kinjal.vrm" as="fetch" crossorigin="anonymous" fetchpriority="low" />
    <link rel="preload" href="%BASE_URL%animations/walk.fbx" as="fetch" crossorigin="anonymous" fetchpriority="low" />
    <link rel="preload" href="%BASE_URL%animations/wave.fbx" as="fetch" crossorigin="anonymous" fetchpriority="low" />
    <link rel="preload" href="%BASE_URL%animations/idle.fbx" as="fetch" crossorigin="anonymous" fetchpriority="low" />
    <!-- free Google Fonts: Anton (titles) + Inter (body). names must match src/theme.ts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
